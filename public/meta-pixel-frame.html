<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Marketing measurement</title>
</head>
<body>
<script>
(() => {
  'use strict';
  const pixelId = '1139005827091005';
  let started = false;
  let pageViewed = false;
  // Direct visits do nothing. Only the embedding application may send event names.
  window.addEventListener('message', (event) => {
    if (window.parent === window || event.source !== window.parent) return;
    if (!['https://edrivedubai.ae', 'http://localhost:4187', 'http://127.0.0.1:4187'].includes(event.origin)) return;
    if (event.data !== 'PageView' && event.data !== 'CompleteRegistration') return;
    if (event.data === 'PageView' && pageViewed) return;
    try {
      if (!started) {
        const fbq = window.fbq = function () {
          if (fbq.callMethod) fbq.callMethod.apply(fbq, arguments);
          else fbq.queue.push(arguments);
        };
        window._fbq = fbq;
        fbq.push = fbq;
        fbq.loaded = true;
        fbq.version = '2.0';
        fbq.queue = [];
        fbq('set', 'autoConfig', false, pixelId);
        fbq('init', pixelId);
        const script = document.createElement('script');
        script.async = true;
        script.referrerPolicy = 'no-referrer';
        script.src = 'https://connect.facebook.net/en_US/fbevents.js';
        document.head.appendChild(script);
        started = true;
      }
      if (event.data === 'PageView') pageViewed = true;
      window.fbq('track', event.data);
    } catch { /* Tracking is optional and cannot affect the parent booking. */ }
  });
})();
</script>
</body>
</html>
